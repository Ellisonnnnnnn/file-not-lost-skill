<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__PAGE_TITLE__</title>
<!-- ============================================================
     MAPSHELL v1.1 · 文件不迷路 索引页样式壳
     本文件由 file-not-lost skill 维护。允许改动的位置只有两处：
       1. 数据块：主脚本里的 MAP 常量
       2. <title> 里的 __PAGE_TITLE__
     其余字节（CSS / 渲染器 / 交互）不得手改。
     改完壳请跑 scripts/rehash_shell.py 重算下面的指纹，
     否则 build_map.py 会以「壳被改动」为由拒绝构建。
     css-sha256: 542272d57297218a
     js-sha256: 730e2b7a58585d67
     ============================================================ -->
<style>
  :root{
    --b1:#EAF4FF; --b2:#D6EAFF; --b6:#0081FF; --b7:#0072E3;
    --n1:#F7F9FC; --n2:#EFF2F6; --n3:#E3E8EF; --n4:#C9D2DD; --n5:#9AA6B4;
    --n6:#6E7B8B; --n7:#4E5A68; --n8:#303133;
    --page:#F5F7FA; --card:#FFFFFF;
    --r:12px;
    --shadow:0 1px 2px rgba(48,49,51,.04);
    --shadow-h:0 10px 26px rgba(0,129,255,.10);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%; scroll-behavior:smooth}
  body{
    margin:0; background:var(--page); color:var(--n8);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  a{color:inherit; text-decoration:none}
  .wrap{width:100%; max-width:1080px; margin:0 auto; padding:0 24px}

  /* ---------- 头部 ---------- */
  .topbar{
    background:#FFF;
    background-image:linear-gradient(180deg,#F4F9FF 0%,#FFFFFF 78%);
    border-bottom:1px solid var(--n3);
  }
  .topbar .wrap{padding-top:26px; padding-bottom:22px}
  .crumb{display:flex; align-items:center; gap:8px; color:var(--n5); font-size:12px}
  .crumb i{font-style:normal; color:var(--n4)}
  .topbar h1{margin:10px 0 0; font-size:24px; line-height:34px; font-weight:600; letter-spacing:-.01em}
  /* 项目名：括号内跟随标题，弱化为辅助层级 */
  .topbar h1 .proj{font-size:16px; line-height:22px; font-weight:500; letter-spacing:0;
    color:var(--n6); margin-left:-.3em}
  .topbar .sub{margin:8px 0 0; color:var(--n6); font-size:13px; line-height:22px}
  .quick{display:flex; flex-wrap:wrap; gap:10px; margin-top:18px}
  .qbtn{
    display:inline-flex; align-items:center; gap:7px; height:36px; padding:0 16px;
    border:1px solid var(--n3); border-radius:8px; background:#FFF; color:var(--n7);
    font-size:13px; font-weight:500; transition:border-color .15s,color .15s,background .15s;
  }
  .qbtn:hover{border-color:var(--b6); color:var(--b7); background:#F7FBFF}
  .qbtn.primary{border-color:var(--b6); background:var(--b6); color:#FFF}
  .qbtn.primary:hover{background:var(--b7); border-color:var(--b7); color:#FFF}
  .qbtn svg{display:block; width:14px; height:14px}

  /* ---------- 右侧锚点 ---------- */
  .rail{
    position:fixed; right:18px; top:50%; transform:translateY(-50%); z-index:20;
    display:flex; flex-direction:column; gap:2px;
  }
  .rail a{
    display:flex; align-items:center; justify-content:flex-start; gap:9px;
    height:26px; padding:0 8px 0 12px; border-radius:6px;
    color:var(--n5); font-size:11.5px; white-space:nowrap;
    transition:color .14s, background .14s;
  }
  .rail a .rn{font-size:10.5px; letter-spacing:.04em; font-variant-numeric:tabular-nums}
  .rail a .rt{display:none; font-size:12px}
  .rail:hover a .rt{display:inline}
  @media (min-width:1320px){ .rail a .rt{display:inline} }
  .rail:hover{
    background:#FFF; border-radius:10px; padding:6px 0;
    box-shadow:0 0 0 1px var(--n3), 0 8px 24px rgba(48,49,51,.10);
  }
  .rail a:hover{color:var(--b7); background:#F2F8FF}
  .rail a.on{color:var(--b6); background:#EAF4FF}
  .rail a.on .rn, .rail a.on .rt{font-weight:600}
  @media (max-width:1219px){ .rail{display:none} }

  /* ---------- 分区 ---------- */
  main{padding:46px 0 10px}
  section{margin-bottom:40px; scroll-margin-top:24px}
  .shead{display:flex; align-items:baseline; gap:10px; margin-bottom:4px}
  .shead .no{
    flex:0 0 auto; font-size:12px; font-weight:600; color:var(--b6);
    font-variant-numeric:tabular-nums; letter-spacing:.04em;
  }
  .shead h2{margin:0; font-size:17px; line-height:26px; font-weight:600}
  .shead .count{
    margin-left:2px; padding:0 6px; border-radius:4px; background:var(--n2);
    color:var(--n6); font-size:11px; line-height:18px; font-weight:500;
  }
  .sdesc{margin:0 0 16px 26px; color:var(--n6); font-size:12.5px; line-height:20px}
  /* 空分区：分区保留、内容留白，不用占位卡凑数 */
  .sempty{
    margin:0 0 4px; padding:16px 18px; border:1.5px dashed var(--n4);
    border-radius:var(--r); background:transparent;
    color:var(--n5); font-size:12.5px; line-height:20px;
  }
  .d-grid:empty{display:none}

  /* ---------- 二级分类（其他文件） ---------- */
  .subgroup+.subgroup{margin-top:28px}
  .subhead{display:flex; align-items:center; gap:8px; margin:0 0 8px;
    padding-bottom:9px; border-bottom:1px solid var(--n2)}
  .subhead h3{margin:0; font-size:14px; line-height:22px; font-weight:600; color:var(--n8)}
  .subhead h3::before{content:""; display:inline-block; width:3px; height:12px;
    margin-right:8px; border-radius:2px; background:var(--b6); vertical-align:-1px}
  .subhead .scount{padding:0 6px; border-radius:4px; background:var(--n2);
    color:var(--n6); font-size:11px; line-height:18px; font-weight:500}
  .subdesc{margin:0 0 12px; color:var(--n6); font-size:12px; line-height:19px}

  /* ---------- 可折叠分区 ---------- */
  section.collapsible .shead{cursor:pointer; user-select:none}
  section.collapsible .shead:focus-visible{outline:2px solid var(--b6); outline-offset:2px; border-radius:6px}
  section.collapsible .shead .chev{
    align-self:center; margin-left:auto; flex:0 0 auto;
    width:22px; height:22px; border-radius:5px;
    display:inline-flex; align-items:center; justify-content:center;
    color:var(--n5);
    transition:transform .2s ease, background .15s, color .15s;
  }
  section.collapsible .shead:hover .chev{background:var(--n1); color:var(--n7)}
  section.collapsible.open .shead .chev{transform:rotate(180deg)}
  section.collapsible .sec-body{display:grid; grid-template-rows:0fr; transition:grid-template-rows .32s ease}
  section.collapsible.open .sec-body{grid-template-rows:1fr}
  section.collapsible .sec-body>.sec-inner{overflow:hidden; min-height:0}

  /* ---------- 模块分组（02 区） ---------- */
  .mods{display:flex; flex-direction:column; gap:10px}
  .mod{border:1px solid var(--n3); border-radius:var(--r); background:var(--card);
    box-shadow:var(--shadow); overflow:hidden;
    transition:border-color .18s, box-shadow .18s}
  .mod:hover{border-color:var(--n4)}
  .mod.open{border-color:var(--b6); box-shadow:var(--shadow-h)}
  .mod-head{display:flex; align-items:center; gap:10px; width:100%;
    padding:13px 16px; background:none; border:0; cursor:pointer;
    text-align:left; font:inherit; color:inherit; user-select:none}
  .mod-head:focus-visible{outline:2px solid var(--b6); outline-offset:-2px}
  .mod-head .mchev{flex:0 0 auto; width:20px; height:20px; border-radius:5px;
    display:inline-flex; align-items:center; justify-content:center; color:var(--n5);
    transition:transform .22s ease, background .15s, color .15s}
  .mod-head:hover .mchev{background:var(--n1); color:var(--n7)}
  .mod.open .mod-head .mchev{transform:rotate(180deg); color:var(--b6)}
  .mod-ico{flex:0 0 auto; color:var(--n5); transition:color .18s}
  .mod.open .mod-ico{color:var(--b6)}
  .mod-head b{font-size:14px; line-height:22px; font-weight:600; color:var(--n8)}
  .mod-head .cnt{flex:0 0 auto; padding:0 6px; border-radius:4px; background:var(--n2);
    color:var(--n6); font-size:11px; line-height:18px; font-weight:500}
  .mod.open .mod-head .cnt{background:var(--b1); color:var(--b7)}
  .mod-head .mstatus{margin-left:auto; flex:0 0 auto}
  .mod-body{display:grid; grid-template-rows:0fr;
    transition:grid-template-rows .34s cubic-bezier(.2,.7,.3,1)}
  .mod.open .mod-body{grid-template-rows:1fr}
  .mod-inner{overflow:hidden; min-height:0}
  .frows{margin:0 12px 12px 46px; padding:2px 0 2px 16px;
    border-left:2px solid var(--n3); display:flex; flex-direction:column; gap:2px;
    transition:border-color .25s}
  .mod.open .frows{border-left-color:var(--b1)}
  .frow{display:block; padding:10px 12px; border-radius:8px;
    text-decoration:none; color:inherit; transition:background .14s}
  .frow:hover{background:var(--n1)}
  .frow .fr-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .frow .fr-top b{font-size:13px; line-height:20px; font-weight:600; color:var(--n8); word-break:break-all}
  .frow .fr-top .size{margin-left:auto; color:var(--n5); font-size:11px;
    font-variant-numeric:tabular-nums; white-space:nowrap}
  .frow p{margin:5px 0 0; color:var(--n6); font-size:12px; line-height:19px}
  .frow p strong{font-weight:600; color:var(--n7)}
  @media (prefers-reduced-motion: no-preference){
    .mod.open .frow{animation:rowIn .32s ease both; animation-delay:calc(var(--i)*55ms)}
    @keyframes rowIn{from{opacity:0; transform:translateY(7px)} to{opacity:1; transform:none}}
  }
  @media (max-width:760px){
    .frows{margin-left:14px}
    .mod-head .mstatus{display:none}
  }

  /* ---------- 文件夹卡片（02 区） ---------- */
  .mods{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px}
  .mod{position:relative}
  .folder{display:block; width:100%; padding:14px 14px 12px; background:none; border:0;
    cursor:pointer; text-align:left; font:inherit; color:inherit; user-select:none}
  .folder:focus-visible{outline:2px solid var(--b6); outline-offset:-2px; border-radius:var(--r)}
  .shots{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .shot{position:relative; display:block; border-radius:8px; background:var(--n1);
    aspect-ratio:16/10; overflow:hidden; text-decoration:none; color:inherit;
    transition:box-shadow .16s}
  .shot img{width:100%; height:100%; object-fit:cover; object-position:top left; display:block;
    transition:transform .3s ease}
  a.shot:hover{box-shadow:0 0 0 2px var(--b6)}
  a.shot:hover img{transform:scale(1.04)}
  .shot.empty{border:1.5px dashed var(--n4); background:transparent}
  .shot.more{display:flex; align-items:center; justify-content:center;
    background:var(--n1); color:var(--n6); font-size:12px; font-weight:500;
    border:1.5px dashed var(--n4); cursor:default}
  .fbar{display:flex; align-items:center; gap:9px; margin-top:12px}
  .fbar .fico{flex:0 0 auto; color:#F7B500; display:flex}
  .mod.open .fbar .fico{color:#EFA900}
  .fbar b{font-size:13.5px; line-height:20px; font-weight:600; color:var(--n8)}
  .fbar .fnum{margin-left:auto; flex:0 0 auto; display:flex; align-items:center; gap:8px;
    color:var(--n5); font-size:12px; font-variant-numeric:tabular-nums}
  .fbar .fnum .mchev{width:16px; height:16px}
  .mod.open .fbar .fnum .mchev{transform:rotate(180deg); color:var(--b6)}
  .mod-head{display:none}
  .mod .mod-body{margin-top:2px}
  .mod .frows{margin:2px 12px 12px 16px; border-left-color:var(--n3)}
  @media (max-width:760px){ .mods{grid-template-columns:1fr} }
  /* ---------- 主稿卡片（01 区，左右分栏） ---------- */
  .file.hero-card{flex-direction:row; align-items:stretch; gap:16px; padding:14px}
  .hero-shot{flex:0 0 40%; max-width:400px; border:1px solid var(--n3); border-radius:8px;
    overflow:hidden; background:var(--n1); aspect-ratio:16/10}
  .hero-shot img{width:100%; height:100%; object-fit:cover; object-position:top left; display:block;
    transition:transform .3s ease}
  .file.hero-card:hover .hero-shot img{transform:scale(1.02)}
  .hero-info{flex:1 1 auto; min-width:0; display:flex; flex-direction:column}
  .hero-info .fmeta{margin-top:auto}
  @media (max-width:760px){
    .file.hero-card{flex-direction:column}
    .hero-shot{flex:none; width:100%; max-width:none}
  }

  /* ---------- 文件卡片 ---------- */
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px}
  .grid.one{grid-template-columns:1fr}
  .file{
    display:flex; flex-direction:column; min-width:0;
    padding:14px 16px; border:1px solid var(--n3); border-radius:var(--r);
    background:var(--card); box-shadow:var(--shadow);
    transition:border-color .16s, box-shadow .16s, transform .16s;
  }
  .file:hover{border-color:var(--b6); box-shadow:var(--shadow-h); transform:translateY(-1px)}
  .file .fhead{display:flex; align-items:center; gap:8px; margin-bottom:9px}
  .ext{
    padding:0 6px; border-radius:4px; background:var(--b1); color:var(--b7);
    font-size:10px; font-weight:600; line-height:18px; letter-spacing:.03em;
  }
  .ext.txt{background:#F3F0FF; color:#6A54D8}
  .ext.web{background:#E9F7EF; color:#1D8A52}
  .file .size{margin-left:auto; color:var(--n5); font-size:11px; font-variant-numeric:tabular-nums}
  .ver{
    padding:0 6px; border-radius:4px; background:#F4F5F7; color:var(--n5);
    font-size:10.5px; line-height:18px; font-weight:500;
  }
  .ver.on{background:#E9F7EF; color:#1D8A52}
  .file b{
    display:block; color:var(--n8); font-size:13.5px; line-height:20px; font-weight:600;
    word-break:break-all;
  }
  .file small{display:block; margin-top:5px; color:var(--n6); font-size:12px; line-height:19px}
  .file small strong{font-weight:600; color:var(--n7)}
  .file small code, .tl-body code, footer code{
    padding:0 4px; border-radius:3px; background:var(--n1); border:1px solid var(--n3);
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:var(--n6);
    word-break:break-all;
  }
  .file .fmeta{
    display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; margin-top:12px; padding-top:10px;
    border-top:1px dashed var(--n3); color:var(--n5); font-size:11px;
    font-variant-numeric:tabular-nums;
  }
  .file .fmeta>span{flex:0 0 auto; white-space:nowrap}
  .file .fmeta .tag{
    padding:0 6px; border-radius:3px; background:var(--n1); color:var(--n6);
    line-height:17px; font-size:10.5px; white-space:nowrap;
  }
  .file .fmeta .tag.blue{background:var(--b1); color:var(--b7)}
  .file .fmeta .tag.green{background:#E9F7EF; color:#1D8A52}
  .file .fmeta .tag.gray{background:#F4F5F7; color:var(--n5)}
  .path{
    margin-top:10px; padding:7px 9px; border-radius:6px; background:var(--n1);
    color:var(--n6); font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:11px; line-height:17px; word-break:break-all;
  }
  /* 在线链接的地址过长时单行省略，不用把 ID 尾巴折到第二行 */
  .file[href^="http"] .path{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

  /* ---------- 版本轨迹：按天分组 ---------- */
  .daygroup{display:flex; gap:20px; padding:16px 0; border-bottom:1px dashed var(--n3)}
  .daygroup:first-child{padding-top:0}
  .daygroup:last-child{border-bottom:0; padding-bottom:0}
  .dg-left{flex:0 0 90px}
  .dg-left b{display:block; color:var(--n8); font-size:13px; font-weight:600; font-variant-numeric:tabular-nums}
  .dg-left span{display:block; margin-top:2px; color:var(--n5); font-size:11px; font-variant-numeric:tabular-nums}
  .dg-body{flex:1; min-width:0}
  .dg-body p{margin:0 0 10px; color:var(--n6); font-size:12.5px; line-height:20px}
  .dg-body p b{color:var(--n7); font-weight:600}
  .snaps{display:flex; flex-wrap:wrap; gap:6px}
  .snaps a{
    display:inline-flex; align-items:center; gap:6px; padding:2px 8px;
    border:1px solid var(--n3); border-radius:5px; background:var(--n1);
    color:var(--n6); font-size:11px; line-height:18px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    transition:border-color .14s,color .14s,background .14s;
  }
  .snaps a:hover{border-color:var(--b6); color:var(--b7); background:#F7FBFF}
  .snaps a em{font-style:normal; color:var(--n4); font-size:10.5px}
  .snaps a.now{border-color:var(--b6); color:var(--b7); background:#F4F9FF}

  /* ---------- 时间轴（旧样式，保留给一句话结论用） ---------- */
  .timeline{position:relative; margin:0 0 18px 8px; padding-left:22px}
  .timeline::before{
    content:""; position:absolute; left:5px; top:6px; bottom:8px; width:1px; background:var(--n3);
  }
  .tl-item{position:relative; padding:0 0 16px 0}
  .tl-item:last-child{padding-bottom:0}
  .tl-item::before{
    content:""; position:absolute; left:-21px; top:5px; width:9px; height:9px;
    border-radius:50%; background:#FFF; border:2px solid var(--n4);
  }
  .tl-item.done::before{border-color:var(--b6); background:var(--b6)}
  .tl-item.now::before{border-color:var(--b6); background:#FFF; box-shadow:0 0 0 4px rgba(0,129,255,.14)}
  .tl-time{color:var(--n5); font-size:11px; font-variant-numeric:tabular-nums}
  .tl-body{margin-top:2px}
  .tl-body b{font-size:13px; font-weight:600; color:var(--n8)}
  .tl-body p{margin:3px 0 0; color:var(--n6); font-size:12px; line-height:19px}
  .tl-snap{
    display:inline-block; margin-top:6px; padding:1px 7px; border-radius:4px;
    background:var(--n1); border:1px solid var(--n3); color:var(--n6);
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px;
  }
  .tl-snap:hover{border-color:var(--b6); color:var(--b7); background:#F7FBFF}

  /* ---------- 提示条 ---------- */
  .note{
    display:flex; gap:10px; padding:12px 14px; border-radius:10px;
    background:#FFFBE9; border:1px solid #F3E3B0; color:#7A6114; font-size:12.5px; line-height:20px;
  }
  .note.blue{background:#F4F9FF; border-color:#D6EAFF; color:#1A5FA8}
  .note svg{flex:0 0 15px; width:15px; height:15px; margin-top:2px}


  @media (max-width:760px){
    .topbar h1{font-size:20px; line-height:30px}
    .topbar h1 .proj{font-size:14px; line-height:20px}
    .grid{grid-template-columns:1fr}
    .sdesc{margin-left:0}
    .daygroup{flex-direction:column; gap:8px}
    .dg-left{flex:0 0 auto; display:flex; align-items:baseline; gap:8px}
  }

  .topbar h1 .vchip{display:inline-flex; align-items:center; height:22px; margin-left:10px;
    padding:0 8px; border:1px solid var(--b2); border-radius:6px; background:var(--b1);
    color:var(--b7); font-size:11px; font-weight:600; letter-spacing:.02em; vertical-align:4px}
  /* ============================================================
     层叠 2：纸片层叠 + 点击向上扇形展开 + 蒙层（与方案页同一套）
     ============================================================ */
  .d-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:16px;
    align-items:start}
  .d-stack{position:relative; min-width:0; padding-top:20px; cursor:pointer}
  .d-back{position:absolute; height:28px; border-radius:var(--r); border:1px solid var(--n4);
    background:#FFF; box-shadow:0 1px 3px rgba(48,49,51,.06);
    transition:transform .26s cubic-bezier(.2,.7,.3,1), opacity .22s}
  .d-back.b1{top:9px; left:12px; right:12px; z-index:1}
  .d-back.b2{top:2px; left:24px; right:24px; z-index:0; background:#FAFBFD}
  .d-stack:hover .d-back.b1{transform:translateY(-3px)}
  .d-stack:hover .d-back.b2{transform:translateY(-6px)}
  .d-stack.is-open .d-back{opacity:0}

  .d-card{position:relative; z-index:2; border:1px solid var(--n3); border-radius:var(--r);
    background:var(--card); box-shadow:var(--shadow); overflow:hidden;
    transition:border-color .18s, box-shadow .18s, opacity .18s}
  .d-card:hover{border-color:var(--b6); box-shadow:var(--shadow-h)}
  .d-stack.is-open .d-card{opacity:0; pointer-events:none}

          + (sec.item

                : '<div>' + emp + '</div>')

      }
      else if (sec.type === 'grid'){
        var cards = sec.items || [];

             +  (cards.length ? '' : emp);

      else if (sec.type === 'timeline'){
        var days = sec.days || [];
        body += (days.length
          ? days.map(function(d){
              return '<div class="daygroup">'

                + '<div class="dg-body"><p>' + rich(d.body || '') + '</p><div class="snaps">'
                + (d.snaps || []).map(function(s){
                    return '<a' + (s.now ? ' class="now"' : '') + ' href="' + esc(s.href) + '" target="_blank">'
                         + esc(s.title) + '<em>' + esc(s.size || '') + '</em></a>';
                  }).join('')

          : emp) + noteHTML(sec.note, false);

      else if (sec.type === 'subgroups'){
        var grs = sec.groups || [];
        body += (grs.length
          ? grs.map(function(gr){

      var secBody = fold

      return '<section id="' + esc(sec.id) + '"' + (sec.anchor ? ' data-anchor="' + esc(sec.anchor) + '"' : '')

    document.getElementById('main').innerHTML = html;

    /* 填充卡片 */
    (MAP.sections || []).forEach(function(sec){
      if (sec.type === 'lead'){ if (sec.item) paint(document.getElementById('host-' + sec.id), [sec.item]); }
      else if (sec.type === 'grid') paint(document.getElementById('host-' + sec.id), sec.items);
      else if (sec.type === 'subgroups') (sec.groups || []).forEach(function(gr){
        paint(document.getElementById('host-' + sec.id + '-' + gr.id), gr.items);

  })();
  /* ================= 渲染器结束 ================= */

  /* ==INTERACT-BEGIN== */
    /* ---------------- 浮层与扇形 ---------------- */
  var dfan = document.getElementById('dfan');
  var dfanVeil = dfan.querySelector('.dfan-veil');
  var dfanFolder = dfan.querySelector('.dfan-folder');
  var dfanFan = dfan.querySelector('.dfan-fan');
  var dfanUndo = dfan.querySelector('.dfan-undo');
  var dfanDlg = document.getElementById('dfanDlg');
  var dlgT = dfanDlg.querySelector('h4');
  var dlgCard = dfanDlg.querySelector('.dfan-dlg-card');
  var dlgOk = dfanDlg.querySelector('.dlg-ok');
  var dlgNo = dfanDlg.querySelector('.dlg-no');
  var dlgCtx = null, dlgTimer = 0;
  var dOpen = null, dTimer = 0;
  var FAN_MAX = 5;
  var fanCtx = null;

  function gOf(stack){ return BY[stack.getAttribute('data-id')]; }

  function fanModel(g){
    var c = fanCtx, itemW = c.itemW, itemH = c.itemH;
    var availHalf = Math.min(c.cx - 12, c.vw - c.cx - 12);
    var all = live(g).slice(1);
    var n = all.length;
    var capByWidth = Math.max(2, Math.floor((availHalf * 2) / (itemW + 34)) + 1);
    var slots = Math.min(n, FAN_MAX, capByWidth);

    var layoutFan = function(cnt, gp){
      if (cnt < 2) return { xs:[0], half:0, R:760, ths:[0] };
      var hh = (cnt - 1) * (itemW + 34) / 2;
      var rad = Math.max(760, hh / Math.sin(26 * Math.PI / 180));
      var pos = [], ths = [], ws = [];
      for (var i = 0; i < cnt; i++) pos[i] = (i - (cnt - 1) / 2) * (itemW + 34);
      for (var pass = 0; pass < 4; pass++){
        ths = pos.map(function(q){ return Math.asin(Math.max(-1, Math.min(1, q / rad))); });
        ws = ths.map(function(t){ return itemW * Math.cos(t) + itemH * Math.abs(Math.sin(t)); });
        var acc = [0];
        for (var k = 1; k < cnt; k++) acc[k] = acc[k - 1] + (ws[k - 1] + ws[k]) / 2 + gp;
        var span = acc[cnt - 1];
        pos = acc.map(function(q){ return q - span / 2; });
        hh = span / 2;
        rad = Math.max(760, hh / Math.sin(26 * Math.PI / 180));
      }
      ths = pos.map(function(q){ return Math.asin(Math.max(-1, Math.min(1, q / rad))); });
      return { xs: pos, half: hh, R: rad, ths: ths };
    };

    var gap = 18, fan = layoutFan(slots, gap);
    for (var guard = 0; guard < 8; guard++){
      var eTh = Math.abs(fan.ths[0]);
      var eBox = (itemW * Math.cos(eTh) + itemH * Math.sin(eTh)) / 2;
      if (fan.half + eBox <= availHalf) break;
      if (gap > 6) gap -= 4;
      else if (slots > 2){ slots -= 1; gap = 18; }
      else break;
      fan = layoutFan(slots, gap);
    }

    var pack = n > slots;
    var shown = pack ? all.slice(0, slots - 1) : all;
    var lift = itemH / 2 + 50;
    var D = fan.R - lift;
    var thMax = Math.abs(fan.ths[0]);
    var aabbH = itemH * Math.cos(thMax) + itemW * Math.sin(thMax);
    return { all: all, n: n, slots: slots, pack: pack, shown: shown,
             xs: fan.xs, ths: fan.ths, R: fan.R, half: fan.half,
             D: D, lift: lift, need: lift + aabbH / 2 + 24 };
  }

  function fanHTML(g, model){
    if (!model.n) return '<div class="dfan-empty">历史文件已全部删除</div>';
    var itemW = fanCtx.itemW;
    var mid = (model.slots - 1) / 2;
    var seat = function(i){
      var th = model.ths[i] || 0;
      var y = model.D - model.R * Math.cos(th);
      return ' style="--w:' + itemW + 'px;--x:' + Math.round(model.xs[i] || 0) + 'px;'
        + '--y:' + Math.round(y) + 'px;--rot:' + (th * 180 / Math.PI).toFixed(1) + 'deg;'
        + '--d:' + (170 + Math.round(Math.abs(i - mid) * 70)) + 'ms;'
        + 'z-index:' + (46 - Math.round(Math.abs(i - mid) * 4)) + '"';
    };

    var cells = model.shown.map(function(v, i){
      var shot = v.thumb
        ? '<span class="dfan-shot"><img src="' + T(v.thumb) + '" alt="' + esc(v.title) + ' 预览" loading="lazy">'
          + '<span class="dfan-v">' + esc(v.v) + '</span></span>'
        : '<span class="dfan-shot noimg"><span class="dext">' + esc(v.ext || 'FILE') + '</span>'
          + '<span class="dfan-v">' + esc(v.v) + '</span></span>';
      return '<a class="dfan-item" data-v="' + esc(v.v) + '" href="' + v.href + '" target="_blank"'
        + ' title="' + esc(v.title) + '"' + seat(i) + '>'
        + '<span class="dfan-in">' + shot
        +   '<span class="dfan-meta"><span class="dfan-t">' + esc(v.title) + '</span>'
        +     '<span class="dfan-d">' + esc(v.date) + '</span></span>'
        +   '<span class="dfan-x" role="button" tabindex="-1" aria-label="删除 ' + esc(v.v) + '" title="删除">'
        +     '<svg viewBox="0 0 12 12" fill="none"><path d="M3.7 3.7l4.6 4.6M8.3 3.7l-4.6 4.6"'
        +       ' stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>'
        +   '</span>'
        + '</span></a>';
    });

    if (model.pack){
      cells.push('<button class="dfan-item more" type="button" aria-label="查看全部 ' + model.n + ' 个' + (g.unit || '版本') + '"'
        + seat(model.slots - 1) + '>'
        + '<span class="dfan-in"><span class="dfan-morebox"><b>+' + (model.n - model.shown.length) + '</b>'
        +   '<i>' + (g.moreWord || '更早版本') + '</i></span></span></button>');
    }
    return cells.join('');
  }

  function bindFan(g, stack){
    var mb = dfanFan.querySelector('.dfan-item.more');
    if (mb) mb.addEventListener('click', function(e){
      e.stopPropagation();
      dfanShowAll(g, stack);
    });
    [].forEach.call(dfanFan.querySelectorAll('.dfan-x'), function(x){
      x.addEventListener('click', function(e){
        e.preventDefault();
        e.stopPropagation();
        dfanAsk(g, x.closest('.dfan-item'));
      });
    });
  }

  function syncBar(g){
    var dm = dfanFolder.querySelector('.d-bar .dm');
    if (dm) dm.textContent = live(g).length + ' ' + (g.unit || '个版本');
  }

  function dfanDelete(g, el){
    if (!el || el.classList.contains('out')) return;
    var v = el.getAttribute('data-v');
    if (!v) return;
    el.classList.add('out');
    window.setTimeout(function(){
      g.removed = g.removed || [];
      g.removed.push(v);
      repaintFan(g);
      syncBar(g);
      updateUndo(g);
    }, 170);
  }

  function repaintFan(g){
    var old = {};
    [].forEach.call(dfanFan.querySelectorAll('.dfan-item'), function(el){
      if (el.classList.contains('more')) return;
      old[el.getAttribute('data-v')] = [
        el.style.getPropertyValue('--x'),
        el.style.getPropertyValue('--y'),
        el.style.getPropertyValue('--rot')
      ];
    });

    dfanFan.innerHTML = fanHTML(g, fanModel(g));

    [].forEach.call(dfanFan.querySelectorAll('.dfan-item'), function(el){
      var o = old[el.getAttribute('data-v')];
      if (!o) return;
      el.dataset.tx = el.style.getPropertyValue('--x');
      el.dataset.ty = el.style.getPropertyValue('--y');
      el.dataset.trot = el.style.getPropertyValue('--rot');
      el.style.setProperty('--x', o[0]);
      el.style.setProperty('--y', o[1]);
      el.style.setProperty('--rot', o[2]);
      el.classList.add('settled');
    });
    bindFan(g, fanCtx.stack);
    void dfanFan.offsetWidth;

    /* 先把幸存卡片放回旧位（settled 禁过渡），下一帧再写新位放它们滑过去。
       后台标签页 rAF 会被暂停，所以补一个定时器兜底，避免布局卡在旧位。 */
    var released = false;
    var release = function(){
      if (released) return;
      released = true;
      [].forEach.call(dfanFan.querySelectorAll('.dfan-item.settled'), function(el){
        el.classList.remove('settled');
        if (el.dataset.tx){
          el.style.setProperty('--x', el.dataset.tx);
          el.style.setProperty('--y', el.dataset.ty);
          el.style.setProperty('--rot', el.dataset.trot);
          delete el.dataset.tx; delete el.dataset.ty; delete el.dataset.trot;
        }
      });
    };
    window.requestAnimationFrame(function(){
      window.requestAnimationFrame(release);
    });
    window.setTimeout(release, 160);
  }

  function updateUndo(g){
    var list = g.removed || [];
    if (!list.length){
      dfanUndo.classList.remove('on');
      dfanUndo.innerHTML = '';
      return;
    }
    var last = list[list.length - 1];
    var ver = g.versions.filter(function(x){ return x.v === last; })[0];
    var lb = (ver && !/^v\d+$/i.test(last)) ? ver.title : last;
    dfanUndo.innerHTML = '<span class="du-t">已删除 <b>' + esc(lb) + '</b> · 保留 7 天</span>'
      + (list.length > 1 ? '<span class="du-n">还有 ' + (list.length - 1) + ' 个</span>' : '')
      + '<button class="du-b" type="button">撤回</button>';
    dfanUndo.classList.add('on');
    dfanUndo.querySelector('.du-b').addEventListener('click', function(e){
      e.stopPropagation();
      dfanUndoLast(g);
    });
  }

  function dfanUndoLast(g){
    if (!g.removed || !g.removed.length) return;
    g.removed.pop();
    repaintFan(g);
    syncBar(g);
    updateUndo(g);
  }

  /* ---------- 删除二次确认 ---------- */
  function dfanAsk(g, el){
    var v = el && el.getAttribute('data-v');
    if (!v) return;
    dlgCtx = { g: g, el: el };
    var ver = g.versions.filter(function(x){ return x.v === v; })[0];
    dlgT.textContent = '删除 ' + ((ver && !/^v\d+$/i.test(v)) ? ver.title : v) + '？';
    window.clearTimeout(dlgTimer);
    dfanDlg.classList.add('in');
    dfanDlg.removeAttribute('aria-hidden');
    void dfanDlg.offsetWidth;
    dfanDlg.classList.add('on');
    dlgCard.focus({ preventScroll: true });
  }

  function dfanAskClose(){
    if (!dfanDlg.classList.contains('on')) return;
    dfanDlg.classList.remove('on');
    dfanDlg.setAttribute('aria-hidden', 'true');
    window.clearTimeout(dlgTimer);
    dlgTimer = window.setTimeout(function(){
      if (dfanDlg.classList.contains('on')) return;
      dfanDlg.classList.remove('in');
      dlgCtx = null;
    }, 200);
  }

  dlgNo.addEventListener('click', function(e){
    e.preventDefault(); e.stopPropagation();
    dfanAskClose();
  });
  dfanDlg.querySelector('.dfan-dlg-mask').addEventListener('click', function(e){
    e.preventDefault(); e.stopPropagation();
    dfanAskClose();
  });
  dlgOk.addEventListener('click', function(e){
    e.preventDefault(); e.stopPropagation();
    var c = dlgCtx;
    dfanAskClose();
    if (c) dfanDelete(c.g, c.el);
  });
  dfanDlg.addEventListener('keydown', function(e){
    if (e.key !== 'Tab' || !dfanDlg.classList.contains('on')) return;
    e.preventDefault();
    var order = [dlgNo, dlgOk];
    var i = order.indexOf(document.activeElement);
    if (e.shiftKey) i = i <= 0 ? order.length - 1 : i - 1;
    else i = i >= order.length - 1 ? 0 : i + 1;
    order[i].focus({ preventScroll: true });
  });

  /* ---------- 展开 / 收起 ---------- */
  function dfanOpen(stack){
    var g = gOf(stack);
    if (!g || live(g).length < 2) return;
    if (dOpen) dfanClose();

    var card = stack.querySelector('.d-card');
    var sbw = window.innerWidth - document.documentElement.clientWidth;
    document.documentElement.style.setProperty('--dfan-sb', Math.max(0, sbw) + 'px');
    document.documentElement.classList.add('dfan-lock');

    var r = card.getBoundingClientRect();
    var vw = window.innerWidth, vh = window.innerHeight;
    var cx = r.left + r.width / 2;

    var itemW = Math.round(Math.max(112, Math.min(r.width * 0.42, 148)));
    fanCtx = { g: g, stack: stack, card: card, vw: vw, cx: cx,
               itemW: itemW, itemH: itemW * 0.82, top: 0 };

    var model = fanModel(g);
    var dy = r.top < model.need ? Math.round(model.need - r.top) : 0;
    var maxDy = vh - 24 - r.bottom;
    if (dy > maxDy) dy = Math.max(0, maxDy);
    var top = r.top + dy;

    dfanFolder.innerHTML = '';
    var clone = card.cloneNode(true);
    clone.removeAttribute('id');
    var cbar = clone.querySelector('.d-bar');
    if (cbar && cbar.tagName === 'BUTTON'){
      cbar.setAttribute('aria-label', '收起历史文件');
      cbar.addEventListener('click', dfanClose);
    }
    dfanFolder.appendChild(clone);
    dfanFolder.style.left = r.left + 'px';
    dfanFolder.style.top = r.top + 'px';
    dfanFolder.style.width = r.width + 'px';
    dfanFolder.style.transform = 'translate(0px,0px)';

    fanCtx.top = top;
    dfanFan.style.left = cx + 'px';
    dfanFan.style.top = top + 'px';
    dfanFan.classList.remove('list', 'sd');
    dfanFan.innerHTML = fanHTML(g, model);
    bindFan(g, stack);
    syncBar(g);
    updateUndo(g);

    stack.classList.add('is-open');
    dfan.classList.add('in');
    dfan.removeAttribute('aria-hidden');
    void dfan.offsetWidth;
    var kicked = false;
    var kick = function(){
      if (kicked) return;
      kicked = true;
      dfan.classList.add('on');
      dfanFolder.style.transform = 'translate(0px,' + dy + 'px)';
    };
    window.requestAnimationFrame(kick);
    window.setTimeout(kick, 120);

    var bar = stack.querySelector('.d-bar');
    if (bar && bar.tagName === 'BUTTON') bar.setAttribute('aria-expanded', 'true');
    dOpen = stack;
  }

  function dfanClose(){
    if (!dOpen) return;
    var stack = dOpen; dOpen = null;
    dfanAskClose();
    var bar = stack.querySelector('.d-bar');
    dfan.classList.remove('on');
    dfanFolder.style.transform = 'translate(0px,0px)';
    if (bar && bar.tagName === 'BUTTON') bar.setAttribute('aria-expanded', 'false');
    document.documentElement.classList.remove('dfan-lock');
    window.clearTimeout(dTimer);
    dTimer = window.setTimeout(function(){
      if (dOpen) return;
      dfan.classList.remove('in');
      dfan.setAttribute('aria-hidden', 'true');
      dfanFolder.innerHTML = '';
      dfanFan.innerHTML = '';
      dfanFan.classList.remove('list', 'sd');
      dfanUndo.classList.remove('on');
      dfanUndo.innerHTML = '';
      dfanDlg.classList.remove('on', 'in');
      dfanDlg.setAttribute('aria-hidden', 'true');
      dlgCtx = null;
      stack.classList.remove('is-open');
      /* 删除过的卡在收起时重绘：纸片层与计数跟着变 */
      var g = gOf(stack), sid = stack.getAttribute('data-id');
      if (g && g.removed && g.removed.length){
        var box = document.createElement('div');
        box.innerHTML = stackHTML(g);
        var fresh = box.firstChild;
        stack.parentNode.replaceChild(fresh, stack);
      }
      var back = document.querySelector('.d-stack[data-id="' + sid + '"] .d-bar');
      if (back && document.body.contains(back)) back.focus({ preventScroll:true });
    }, 480);
  }

  /* 全量清单：扇面装不下时，由「+N」入口卡展开 */
  function dfanShowAll(g, stack){
    if (!dOpen || dfanFan.classList.contains('list')) return;
    var cr = stack.querySelector('.d-card').getBoundingClientRect();
    var vw = window.innerWidth, vh = window.innerHeight;
    var ccx = cr.left + cr.width / 2;
    var w = Math.max(300, Math.min(520, vw - 32));
    var up = cr.top - 40, down = vh - cr.top - 36;
    var dir = up >= 240 ? 'up' : 'down';
    var h = Math.max(200, Math.min(430, dir === 'up' ? up : down));
    var sx = 0;
    if (ccx - w / 2 < 16) sx = 16 - (ccx - w / 2);
    else if (ccx + w / 2 > vw - 16) sx = vw - 16 - (ccx + w / 2);

    var list = live(g);
    var wrap = document.createElement('div');
    wrap.className = 'dfan-sheet';
    wrap.style.setProperty('--sw', Math.round(w) + 'px');
    wrap.style.setProperty('--sh', Math.round(h) + 'px');
    wrap.style.setProperty('--sx', Math.round(sx) + 'px');
    wrap.innerHTML = '<div class="ds-head"><b>全部文件</b>'
      + '<span class="ds-n">共 ' + list.length + ' 个</span>'
      + '<button class="ds-back" type="button">返回扇形</button></div>'
      + '<div class="ds-list">' + list.map(function(v, i){
          return '<a class="ds-row' + (i === 0 ? ' cur' : '') + '" href="' + v.href + '" target="_blank"'
            + ' title="' + esc(v.title) + '">'
            + '<span class="ds-v">' + esc(v.v) + '</span>'
            + '<span class="ds-t">' + esc(v.title) + '</span>'
            + '<span class="ds-m">' + esc(v.date) + ' · ' + esc(v.size) + '</span></a>';
        }).join('') + '</div>';

    if (dir === 'down') dfanFan.classList.add('sd');
    dfanFan.appendChild(wrap);
    void wrap.offsetWidth;
    dfanFan.classList.add('list');

    wrap.querySelector('.ds-back').addEventListener('click', function(e){
      e.stopPropagation();
      dfanBackFromList();
    });
  }

  function dfanBackFromList(){
    var wrap = dfanFan.querySelector('.dfan-sheet');
    if (!wrap) return false;
    dfanFan.classList.remove('list');
    window.setTimeout(function(){
      if (wrap.parentNode) wrap.parentNode.removeChild(wrap);
    }, 260);
    window.setTimeout(function(){
      if (!dfanFan.classList.contains('list')) dfanFan.classList.remove('sd');
    }, 300);
    return true;
  }

  /* 点击：多版本整卡负责展开；单文件整卡负责打开文件（与 v1 的整卡可点一致） */
  document.addEventListener('click', function(e){
    var stack = e.target.closest && e.target.closest('.d-stack');
    if (!stack) return;
    if (e.target.closest('.hero')) return;
    if (!stack.classList.contains('is-multi')){
      if (e.target.closest('a')) return;
      var link = stack.querySelector('.d-bar[href]');
      if (!link) return;
      e.preventDefault();
      window.open(link.getAttribute('href'), '_blank');
      return;
    }
    if (stack.classList.contains('is-open')) dfanClose();
    else dfanOpen(stack);
  });

  dfanVeil.addEventListener('click', dfanClose);
  window.addEventListener('resize', function(){ if (dOpen) dfanClose(); });

  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && dOpen){
      if (dfanDlg.classList.contains('on')){ dfanAskClose(); return; }
      if (dfanFan.classList.contains('list')){ dfanBackFromList(); return; }
      dfanClose();
    }
  });
  /* ==INTERACT-END== */
})();
</script>

<script>
(function(){
  var KEY='idx-open-sections';
  function readOpen(){ try{ return JSON.parse(localStorage.getItem(KEY)||'[]'); }catch(e){ return []; } }
  function saveOpen(ids){ try{ localStorage.setItem(KEY, JSON.stringify(ids)); }catch(e){} }
  var sections=[].slice.call(document.querySelectorAll('section.collapsible'));
  function setOpen(sec, open, persist){
    sec.classList.toggle('open', open);
    var head=sec.querySelector('.shead');
    if(head) head.setAttribute('aria-expanded', open?'true':'false');
    if(persist!==false){
      saveOpen(sections.filter(function(x){return x.classList.contains('open');})
                       .map(function(x){return x.id;}));
    }
  }
  sections.forEach(function(sec){
    var head=sec.querySelector('.shead');
    if(!head) return;
    head.addEventListener('click', function(){ setOpen(sec, !sec.classList.contains('open')); });
    head.addEventListener('keydown', function(e){
      if(e.key==='Enter'||e.key===' '){ e.preventDefault(); setOpen(sec, !sec.classList.contains('open')); }
    });
  });
  var opened=readOpen();
  sections.forEach(function(sec){ setOpen(sec, opened.indexOf(sec.id)>=0, false); });
  [].slice.call(document.querySelectorAll('.rail a[href^="#"]')).forEach(function(a){
    a.addEventListener('click', function(){
      var sec=document.getElementById(a.getAttribute('href').slice(1));
      if(sec && sec.classList.contains('collapsible')) setOpen(sec, true);
    });
  });
})();
</script>

<script>
(function(){
  var rail=document.querySelector('.rail'); if(!rail) return;
  var links=[].slice.call(rail.querySelectorAll('a'));
  var secs=links.map(function(a){ return document.getElementById(a.getAttribute('href').slice(1)); });
  var cur=-1, raf=null;
  function sync(){
    var probe=window.scrollY+Math.min(200, window.innerHeight*0.28), idx=0;
    for(var i=0;i<secs.length;i++){
      if(!secs[i]) continue;
      var top=secs[i].getBoundingClientRect().top+window.scrollY;
      if(top<=probe) idx=i;
    }
    if(window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-8) idx=secs.length-1;
    if(idx===cur) return;
    cur=idx;
    links.forEach(function(a,i){ a.classList.toggle('on', i===idx); });
  }
  function onScroll(){ if(raf) return; raf=requestAnimationFrame(function(){ raf=null; sync(); }); }
  window.addEventListener('scroll',onScroll,{passive:true});
  window.addEventListener('resize',onScroll);
  sync();
})();
</script>
